name: ci

# Org gate contract for eshu-hq collector repos (epic #1): stable job names
# lint/test/race/shell/image, a changes path-filter, govulncheck and
# gosec scans, and a ci-complete aggregator. ci-complete is the only context
# the main ruleset requires. No static gates: lanes judge the code itself,
# except the 500-line .go file cap (plain wc -l step in the reusable lint).
#
# Lane bodies run from the pinned eshu-hq/.github reusable (issue #4). The
# caller keeps the changes path-filter and the ci-complete aggregator, so
# the required context name never churns; only the bodies moved. Pinned to
# the v2 merge commit the selftest callers proved green, never the tag.
#
# Coverage notes: the ported collector holds real coverable statements, so
# coverage-floor is ratcheted from 0 to the measured 76 (#2) and may only
# rise toward 90 from here; never lower it or delete assertions to move it.
#
# Image note: the Dockerfile builds the actual collector, so run-image follows
# the image filter and the lane runs a real build (no push) through the
# reusable. #3 closed on the first build proof (local digest recorded in the
# port handoff; the manifest re-pins on the first registry push).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 04:23 UTC sweep: every lane runs as a record. Scan
    # findings on scheduled runs fail their lanes; triage rides the run
    # artifacts until the reusable grows a filing hook (upstream follow-up).
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      workflow: ${{ steps.filter.outputs.workflow }}
      image: ${{ steps.filter.outputs.image }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            fixtures:
              # No testdata, JSON, or embedded config exists yet; these
              # entries activate as those files land. Each entry MUST be
              # test-consumed (grep-proven) before it is relied on — #2
              # owns that proof when the first fixture lands.
              - '**/testdata/**'
              - '**/*.json'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            workflow:
              - '.github/workflows/**'
            image:
              - 'Dockerfile'
              - 'cmd/**'
            misc:
              # Fail-closed catch-all: anything not classified above runs
              # the full Go lanes (lint+test+race). Docs stay skipped so a
              # docs-only PR keeps passing vacuously; every classified
              # pattern is negated too so narrow lanes keep their shape.
              # This classifies Makefile, .github/dependabot.yml, and all
              # future file types.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!**/testdata/**'
              - '!**/*.json'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!cmd/**'
              - '!.github/workflows/**'

  lanes:
    name: lanes
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: azure-cloud
      go-version-file: go.mod
      coverage-floor: 76
      # Pin every tool the retired lanes pinned. Reusable defaults float
      # across tags, and this move must neither downgrade nor silently
      # upgrade a scanner. (gosec stays at v2.30.0, newer than the default;
      # shellcheck has no version input: the reusable pins its action by
      # SHA, which the v2 pin freezes.)
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-test: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-race: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-shell: ${{ github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true' || needs.changes.outputs.workflow == 'true' }}
      # Filter-only (see the image note above): the Dockerfile builds the
      # actual collector, so any Dockerfile or cmd change runs a real
      # image build (no push) in the lane.
      run-image: ${{ needs.changes.outputs.image == 'true' }}
      # No boundary gate in this repo; the port (#2) owns its definition.
      run-boundary: false
      run-govulncheck: ${{ github.event_name != 'pull_request' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
      run-gosec: ${{ github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true' }}
      # Preserve advisory-always: the inline lane never failed on findings
      # (triage in the open), and there is no code to scan yet.
      gosec-fail-on-findings: false
      run-actionlint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true' }}

  ci-complete:
    name: ci-complete
    needs: [changes, lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import sys
          needs = json.loads(os.environ['NEEDS'])
          for name in sorted(needs):
              print(f"{name}: {needs[name].get('result')}")
          bad = {k: v.get('result') for k, v in needs.items()
                 if v.get('result') not in ('success', 'skipped')}
          if bad:
              print(f'ci-complete: failing lanes: {bad}')
              sys.exit(1)
          print('ci-complete: every lane succeeded or was legitimately skipped')
          EOF
